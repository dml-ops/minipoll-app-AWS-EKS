apiVersion: v1
kind: ConfigMap                    # plain, non-secret settings
metadata: { name: backend-config, namespace: backend }
data:
  DB_HOST: postgres.database.svc.cluster.local   # service.namespace.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: minipoll
  DB_SSL: "false"                  # "true" on AWS, because RDS requires SSL
  ENABLE_DEBUG: "true"             # turns on /api/debug/burn and /api/debug/crash for demos
---
apiVersion: apps/v1
kind: Deployment                   # keeps N copies running
metadata: { name: backend, namespace: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never remove an old pod before a new one is ready
      maxSurge: 1
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: minipoll-backend:dev
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: db-credentials }   # created with a command, never stored in Git
          resources:
            requests: { cpu: 100m, memory: 128Mi }  # guaranteed amount (autoscaling measures against this)
            limits: { cpu: 300m, memory: 256Mi }    # the ceiling
          livenessProbe:                            # is it stuck? if this fails the container restarts
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:                           # can it take traffic? if this fails it leaves the Service
            httpGet: { path: /api/readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service                      # a stable internal address
metadata: { name: backend, namespace: backend }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports: [{ port: 3000, targetPort: 3000 }]
